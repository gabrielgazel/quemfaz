[theme]
# Tema base claro
base = "light"
primaryColor = "#1B5E3A"
backgroundColor = "#FAFAF8"
secondaryBackgroundColor = "#E9F0EA"
textColor = "hsl(0, 0%, 10%)"
baseRadius = "medium"

# Corpo de texto: Inter (Google Fonts), com fallback sans-serif
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,300..700&display=swap, sans-serif"

# Títulos: Poppins (Google Fonts), com fallback sans-serif
headingFont = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap, sans-serif"

# Código: Fira Code (Google Fonts), com fallback monospace
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#E9F0EA"
secondaryBackgroundColor = "#FAFAF8"
textColor = "#1A1A1A"